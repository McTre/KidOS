<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KidOS - Soita</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="../../shared/audio.js" defer></script>
  <script src="./call.js" defer></script>
</head>
<body>
  <main class="call-shell">
    <section class="screen-view active" id="adultView" aria-label="Aikuisen soittonäkymä">
      <div class="adult-topline">
        <div class="small-symbol">📞</div>
        <div>
          <h1>AIKUINEN</h1>
          <p class="adult-help">ANNA NEUKKARIN KOODI</p>
        </div>
      </div>

      <input
        id="codeInput"
        class="meet-input"
        type="text"
        inputmode="text"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
        placeholder="sauna kettu pilvi"
        aria-label="Neukkarin liittymiskoodi"
      />

      <p class="adult-help compact">KOLME SANAA NEUKKARIN HUONEESTA</p>

      <p class="error-text" id="errorText" aria-live="polite"></p>

      <div class="adult-actions">
        <label class="child-name">
          LAPSEN NIMI
          <input
            id="childNameInput"
            type="text"
            maxlength="17"
            autocomplete="off"
            spellcheck="false"
            aria-label="Lapsen nimi puhelussa"
          />
        </label>
      </div>

      <button class="hold-button" id="holdButton" type="button">
        PIDÄ 3 SEKUNTIA
        <span id="holdProgress">3</span>
      </button>
    </section>

    <section class="screen-view" id="openedView" aria-label="Puhelu avattu">
      <div class="big-symbol">✨</div>
      <h1>SOITTO AVATTU</h1>
      <p class="helper-text">PUHELU AUKESI OMAAN IKKUNAAN</p>
      <button class="back-button" id="newCallButton" type="button">UUSI SOITTO</button>
    </section>
  </main>
</body>
</html>
